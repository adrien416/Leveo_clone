<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevéO — Merci pour cette aventure</title>
  <meta name="description" content="LevéO ferme ses portes. Retrouvez Adrien Pannetier chez Prouesse.">
  <meta name="robots" content="noindex, follow">

  <!-- Redirection automatique (fallback si le JS est désactivé) -->
  <meta http-equiv="refresh" content="6; url=https://prouesse.vc">
  <link rel="canonical" href="https://prouesse.vc">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(180deg, #1C1235 0%, #2A1845 50%, #1C1235 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .card {
      max-width: 560px;
      animation: rise .8s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 180px;
      height: auto;
      margin: 0 auto 40px;
      display: block;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,.75);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }
    p .accent { color: #F06BAC; font-weight: 600; }
    .btn {
      display: inline-block;
      padding: 18px 44px;
      background: linear-gradient(135deg, #E8318A, #F06BAC);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(232, 49, 138, 0.35);
      transition: transform .2s, box-shadow .2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232, 49, 138, 0.5);
    }
    .countdown {
      margin-top: 28px;
      font-size: .9rem;
      color: rgba(255,255,255,.45);
    }
    .countdown span { color: #F06BAC; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="LevéO logo blanc + flèche rose.png" alt="LevéO">
    <h1>Merci pour cette aventure.</h1>
    <p>
      LevéO ferme ses portes. Adrien Pannetier continue d'accompagner
      entrepreneurs et investisseurs chez <span class="accent">Prouesse</span>.
    </p>
    <a class="btn" href="https://prouesse.vc">Découvrir Prouesse &rarr;</a>
    <div class="countdown">
      Redirection automatique dans <span id="count">6</span> secondes…
    </div>
  </div>

  <script>
    // Compte à rebours + redirection
    var seconds = 6;
    var el = document.getElementById('count');
    var timer = setInterval(function () {
      seconds -= 1;
      if (el) el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'https://prouesse.vc';
      }
    }, 1000);
  </script>
</body>
</html>
